name: iOS App Store CI

on:
  workflow_dispatch: # Allows manual triggering from GitHub's UI

jobs:
  build_ios:
    name: Build and Export iOS .ipa
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Install Cocoapods
        run: |
          cd ios/App
          pod install

      - name: Install Apple Certificates & Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Use macOS temporary runner directory
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode certificates from GitHub Secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Extract Provisioning Profile data safely using macOS PlistBuddy
          security cms -D -i $PP_PATH > profile.plist
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' profile.plist)
          
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

      - name: Build and Export IPA via Fastlane
        run: |
          cd ios/App
          
          # Extract precise details from the Provisioning Profile using PlistBuddy
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          security cms -D -i $PP_PATH > profile.plist
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' profile.plist)
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' profile.plist)
          BUNDLE_ID="com.parachoot.soccer"
          
          # Generate explicit export mapping
          cat <<EOF > exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PROFILE_NAME}</string>
              </dict>
          </dict>
          </plist>
          EOF

          # Compile and export using the explicit mapping
          fastlane gym --workspace "App.xcworkspace" \
                       --scheme "App" \
                       --export_options "exportOptions.plist" \
                       --output_directory "../../build" \
                       --output_name "Parachoot.ipa" \
                       --clean true

      - name: Upload Output IPA File to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Parachoot-Soccer-IPA
          path: build/Parachoot.ipa
          retention-days: 5

      - name: Upload to App Store Connect / TestFlight
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_P8_BASE64: ${{ secrets.APPSTORE_P8_BASE64 }}
        run: |
          cd ios/App
          
          # Create an inline Fastfile to securely handle the API Key in-memory
          cat <<EOF > Fastfile
          lane :upload_to_apple do
            app_store_connect_api_key(
              key_id: ENV["APPSTORE_KEY_ID"],
              issuer_id: ENV["APPSTORE_ISSUER_ID"],
              key_content: ENV["APPSTORE_P8_BASE64"],
              is_key_content_base64: true,
              in_house: false
            )
            upload_to_testflight(
              ipa: "../../build/Parachoot.ipa",
              skip_waiting_for_build_processing: true
            )
          end
          EOF
          
          # Execute the upload lane
          fastlane upload_to_apple
